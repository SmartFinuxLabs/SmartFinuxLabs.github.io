name: Sync to FinuxLabs

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  sync:
    if: github.repository == 'SmartFinuxLabs/SmartFinuxLabs.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history is required to push/sync branches properly
          persist-credentials: false # Prevents default github-actions[bot] token from overriding our PAT

      - name: Push to Destination Repository
        env:
          DEST_REPO_TOKEN: ${{ secrets.DEST_REPO_TOKEN }}
        run: |
          # Push directly with the PAT credentials
          git push --force "https://oauth2:${DEST_REPO_TOKEN}@github.com/finuxlabs/FinuxLabs.github.io.git" main:main
